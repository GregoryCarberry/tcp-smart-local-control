name: Python static checks and offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Parse all Python files (no device access)
        run: python -m compileall -q examples scripts tests
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
